<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Homestay - Đặt Phòng</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #d17a85; --bg: #fff0f3; --card: #ffffff; --text: #5a3d42; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 10px; }
        .container { width: 100%; max-width: 430px; background: var(--card); border-radius: 25px; overflow: hidden; box-shadow: 0 10px 25px rgba(209,122,133,0.15); padding-bottom: 20px; }
        
        .nav-bar { display: flex; background: #ffe3e8; border-bottom: 2px dashed var(--primary); }
        .nav-link { flex: 1; text-align: center; padding: 12px 5px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 13px; }
        .nav-link.active { background: var(--primary); color: white; }

        .header { text-align: center; padding: 15px 15px 5px; }
        .header h1 { color: var(--primary); font-size: 20px; }
        
        .form-group { padding: 10px 20px; }
        label { font-weight: 700; font-size: 13px; display: block; margin-bottom: 5px; color: var(--text); }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ffd0d7; border-radius: 12px; font-size: 14px; outline: none; background: #fff9fa; }
        input:focus, select:focus { border-color: var(--primary); }

        .badge-status { display: flex; gap: 8px; margin-top: 6px; font-size: 11px; font-weight: 700; }
        .badge { padding: 4px 8px; border-radius: 8px; }
        .badge-weekend { background: #ffe3e8; color: var(--primary); }
        .badge-avail { background: #e8f5e9; color: #2e7d32; }

        .price-box { background: #fff0f3; border: 2px dashed var(--primary); border-radius: 15px; padding: 12px; text-align: center; margin: 15px 20px; }
        .price-val { font-size: 22px; font-weight: 700; color: var(--primary); margin: 3px 0; }
        
        .btn-submit { width: calc(100% - 40px); margin: 0 20px; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 15px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(209,122,133,0.3); }

        .qr-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 999; }
        .qr-card { background: white; width: 90%; max-width: 380px; border-radius: 20px; padding: 20px; text-align: center; }
        .qr-card img { width: 100%; max-width: 250px; border-radius: 12px; }
        .btn-close { background: #ffe3e8; color: var(--primary); border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- Menu 3 nút kết nối chuyển trang -->
    <div class="nav-bar">
        <a href="index.html" class="nav-link">🏠 Trang Chủ</a>
        <a href="dat-phong.html" class="nav-link active">📅 Đặt Phòng</a>
        <a href="noi-quy.html" class="nav-link">📜 Nội Quy</a>
    </div>

    <div class="header">
        <h1>🎀 Đặt Phòng Nana Homestay</h1>
    </div>

    <div class="form-group">
        <label>1. Chọn ngày nhận phòng:</label>
        <input type="date" id="checkDate" onchange="updateCalculations()">
        <div class="badge-status">
            <span id="weekendBadge" class="badge badge-weekend">Ngày thường</span>
            <span class="badge badge-avail">🟢 Khung giờ trống</span>
        </div>
    </div>

    <div class="form-group">
        <label>2. Chọn hình thức thuê:</label>
        <select id="rentalType" onchange="updateTimeSlots()">
            <option value="combo2h">Combo 2 giờ</option>
            <option value="combo3h">Combo 4 giờ</option>
            <option value="overnight">Qua đêm (22:00 - 10:00)</option>
            <option value="fullday">Ngày đêm (14:00 - 12:00 hôm sau)</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. Chọn khung giờ thuê:</label>
        <select id="timeSlot" onchange="calculatePrice()"></select>
    </div>

<!-- 4. Thông tin liên hệ -->
    <div class="form-group">
        <label>4. Thông tin liên hệ:</label>
        <input type="text" id="custName" placeholder="Họ và tên của bạn" style="margin-bottom: 8px;">
        <input type="tel" id="custPhone" placeholder="Số điện thoại / Zalo">
    </div>

    <!-- 5. Giờ booking mong muốn -->
    <div class="form-group">
        <label>5. Giờ booking mong muốn:</label>
        <input type="time" id="customTime">
    </div>

    <div class="price-box">
        <div style="font-size: 12px;">Tổng tiền dự tính:</div>
        <div class="price-val" id="totalPrice">150.000đ</div>
        <div style="font-size: 10px; color: #8a626a;">(Đã áp dụng bảng giá tương ứng theo ngày)</div>
    </div>

    <button class="btn-submit" onclick="submitBooking()">🔒 Chốt Đặt Phòng & Thanh Toán</button>
</div>

<!-- Modal QR VietQR -->
<div class="qr-modal" id="qrModal">
    <div class="qr-card">
        <h3 style="color: var(--primary); margin-bottom: 10px;">Quét Mã Thanh Toán VietQR</h3>
        <img id="qrImage" src="" alt="Mã QR Thanh Toán">
        <p style="font-size: 12px; color: #5a3d42; margin-top: 8px;">Nội dung CK: <b id="qrMemo"></b></p>
        <p style="font-size: 11px; color: #8a626a; margin-top: 4px;">Sau khi chuyển khoản, bấm nút gửi xác nhận bên dưới!</p>
        <button class="btn-submit" style="width: 100%; margin: 12px 0 0;" onclick="sendInstagram()">📩 Gửi Xác Nhận Qua Instagram</button>
        <button class="btn-close" onclick="closeModal()">Đóng</button>
    </div>
</div>

<script>
    const BANK_ID = "MB"; 
    const ACCOUNT_NO = "0962292229"; 
    const ACCOUNT_NAME = "NANA HOMESTAY";

    const pricing = {
        normal: { combo2h: 150000, combo3h: 180000, overnight: 300000, fullday: 400000 },
        weekend: { combo2h: 180000, combo3h: 220000, overnight: 350000, fullday: 450000 }
    };

    const slots = {
        combo2h: ["Ca 1 (08:00 - 10:00)", "Ca 2 (10:30 - 12:30)", "Ca 3 (13:00 - 15:00)", "Ca 4 (15:30 - 17:30)", "Ca 5 (18:00 - 20:00)"],
        combo3h: ["Ca 1 (08:00 - 11:00)", "Ca 2 (11:30 - 14:30)", "Ca 3 (15:00 - 18:00)", "Ca 4 (18:30 - 21:30)"],
        overnight: ["Khung giờ chuẩn (22:00 - 10:00 sáng hôm sau)"],
        fullday: ["Khung giờ chuẩn (14:00 - 12:00 trưa hôm sau)"]
    };

    document.getElementById('checkDate').valueAsDate = new Date();

    function isWeekend(dateStr) {
        const d = new Date(dateStr);
        const day = d.getDay();
        return day === 0 || day === 5 || day === 6; 
    }

    function updateCalculations() {
        const dateVal = document.getElementById('checkDate').value;
        const weekendBadge = document.getElementById('weekendBadge');
        if (isWeekend(dateVal)) {
            weekendBadge.innerText = "Cuối tuần (T6 - CN)";
            weekendBadge.style.background = "#ffe3e8";
            weekendBadge.style.color = "#d17a85";
        } else {
            weekendBadge.innerText = "Ngày thường (T2 - T5)";
            weekendBadge.style.background = "#e3f2fd";
            weekendBadge.style.color = "#1976d2";
        }
        calculatePrice();
    }

    function updateTimeSlots() {
        const type = document.getElementById('rentalType').value;
        const slotSelect = document.getElementById('timeSlot');
        slotSelect.innerHTML = "";
        slots[type].forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.innerText = s;
            slotSelect.appendChild(opt);
        });
        calculatePrice();
    }

    function calculatePrice() {
        const dateVal = document.getElementById('checkDate').value;
        const type = document.getElementById('rentalType').value;
        const rates = isWeekend(dateVal) ? pricing.weekend : pricing.normal;
        const price = rates[type];
        document.getElementById('totalPrice').innerText = price.toLocaleString('vi-VN') + "đ";
        return price;
    }

    let currentOrder = {};

    function submitBooking() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const date = document.getElementById('checkDate').value;
        const slot = document.getElementById('timeSlot').value;
        const price = calculatePrice();

        if (!name || !phone) {
            alert("Vui lòng nhập Họ tên và Số điện thoại!");
            return;
        }

        const memo = `NANA ${phone.slice(-4)} ${date.replace(/-/g,'')}`;
        currentOrder = { name, phone, date, slot, price, memo };

        const qrUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${price}&addInfo=${encodeURIComponent(memo)}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;
        
        document.getElementById('qrImage').src = qrUrl;
        document.getElementById('qrMemo').innerText = memo;
        document.getElementById('qrModal').style.display = "flex";
    }

    function closeModal() {
        document.getElementById('qrModal').style.display = "none";
    }

    function sendInstagram() {
        const msg = `🎀 ĐƠN ĐẶT PHÒNG NANA HOMESTAY 🎀\n👤 Khách hàng: ${currentOrder.name}\n📞 SĐT: ${currentOrder.phone}\n📅 Ngày: ${currentOrder.date}\n⏰ Khung giờ: ${currentOrder.slot}\n💰 Tổng tiền: ${currentOrder.price.toLocaleString('vi-VN')}đ\n📝 Nội dung CK: ${currentOrder.memo}`;
        navigator.clipboard.writeText(msg);
        alert("Đã sao chép thông tin đơn đặt phòng! Đang chuyển sang Instagram Nana Homestay...");
        window.open("https://www.instagram.com/nanahomestay_xuan_dinh/", "_blank");
    }

    updateCalculations();
    updateTimeSlots();
</script>

</body>
</html>
