<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Homestay - Bảng Giá</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #d17a85; --bg: #fff0f3; --card: #ffffff; --text: #5a3d42; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 10px; }
        .container { width: 100%; max-width: 430px; background: var(--card); border-radius: 25px; overflow: hidden; box-shadow: 0 10px 25px rgba(209,122,133,0.15); padding-bottom: 20px; }
        
        .nav-bar { display: flex; background: #ffe3e8; border-bottom: 2px dashed var(--primary); align-items: center; }
        .nav-link { flex: 1; text-align: center; padding: 12px 3px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 12px; }
        .nav-link.active { background: var(--primary); color: white; }

        .header { text-align: center; padding: 15px 15px 5px; }
        .header h1 { color: var(--primary); font-size: 20px; }
        .room-subtitle { font-size: 12px; color: #8a626a; margin-top: 4px; font-weight: 600; }

        .section { padding: 15px 20px; }
        .price-card { background: #fff0f3; border-radius: 15px; overflow: hidden; border: 1px solid #ffd0d7; text-align: center; box-shadow: 0 4px 10px rgba(209,122,133,0.1); }
        .price-card img { width: 100%; height: auto; display: block; }
        
        .btn-booking { display: block; width: calc(100% - 40px); margin: 15px 20px 0; background: var(--primary); color: white; text-align: center; padding: 14px; border-radius: 15px; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 4px 10px rgba(209,122,133,0.3); }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <a href="index.html" id="linkHome" class="nav-link">🏠 Trang Chủ</a>
        <a href="bang-gia.html" id="linkBangGia" class="nav-link active">🏷️ Bảng Giá</a>
        <a href="noi-quy.html" id="linkNoiQuy" class="nav-link">📜 Nội Quy</a>
    </div>

    <div class="header">
        <h1>🏷️ Bảng Giá Nana Homestay</h1>
        <div class="room-subtitle" id="roomTitleLabel">Cơ sở 1 - P101</div>
    </div>

    <div class="section">
        <div class="price-card">
            <!-- Ảnh bảng giá sẽ tự động thay đổi theo phòng -->
            <img id="priceImage" src="bang-gia.jpg" alt="Bảng Giá Nana Homestay">
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        // Nhận mã phòng từ URL hoặc bộ nhớ tạm
        const urlParams = new URLSearchParams(window.location.search);
        const currentRoom = urlParams.get('room') || localStorage.getItem('selectedRoom') || 'cs1_p101';

        // Gắn lại tham số ?room=... vào các thẻ điều hướng để khách không bị mất dấu phòng đang xem
        document.getElementById('linkHome').href = `index.html`;
        document.getElementById('linkBangGia').href = `bang-gia.html?room=${currentRoom}`;
        document.getElementById('linkNoiQuy').href = `noi-quy.html?room=${currentRoom}`;

        // Đổi nội dung tiêu đề và hình ảnh bảng giá tương ứng
        const imgElement = document.getElementById('priceImage');
        const titleLabel = document.getElementById('roomTitleLabel');

        if (currentRoom === 'cs2_p205') {
            titleLabel.innerText = "Cơ sở 2 - Phòng 205";
            imgElement.src = "bang-gia-cs2.jpg"; // Ảnh bảng giá Cơ sở 2
        } else if (currentRoom === 'cs2_p305') {
            titleLabel.innerText = "Cơ sở 2 - Phòng 305";
            imgElement.src = "bang-gia-cs2.jpg"; // Ảnh bảng giá Cơ sở 2
        } else {
            titleLabel.innerText = "Cơ sở 1 - P101";
            imgElement.src = "bang-gia.jpg"; // Ảnh bảng giá Cơ sở 1
        }
    };
</script>

</body>
</html>
