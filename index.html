<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Homestay - Trang Chủ</title>
    <!-- Khai báo Logo hiển thị khi thêm vào màn hình chính iPhone -->
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #d17a85; --bg: #fff0f3; --card: #ffffff; --text: #5a3d42; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 10px; }
        .container { width: 100%; max-width: 430px; background: var(--card); border-radius: 25px; overflow: hidden; box-shadow: 0 10px 25px rgba(209,122,133,0.15); padding-bottom: 20px; }
        
        .nav-bar { display: flex; background: #ffe3e8; border-bottom: 2px dashed var(--primary); align-items: center; }
        .nav-link { flex: 1; text-align: center; padding: 12px 5px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 13px; }
        .nav-link.active { background: var(--primary); color: white; }

        .header { text-align: center; padding: 20px 15px 10px; }
        .header .logo-img { width: 70px; height: 70px; object-fit: contain; border-radius: 50%; }
        .header h1 { color: var(--primary); font-size: 24px; margin-top: 5px; }
        
        /* Bộ chọn Cơ sở & Phòng */
        .room-switch-box { margin: 10px 20px; background: #fff0f3; border: 1.5px solid var(--primary); border-radius: 15px; padding: 12px; text-align: center; }
        .room-switch-box label { display: block; font-weight: 700; color: var(--primary); font-size: 13px; margin-bottom: 6px; }
        .room-switch-box select { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid #ffd0d7; font-weight: 700; color: #5a3d42; outline: none; font-size: 13.5px; background: white; cursor: pointer; }

        .section { padding: 12px 20px; }
        .section-title { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 10px; border-left: 4px solid var(--primary); padding-left: 8px; }
        
        .amenities { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
        .amenity-item { background: #ffe3e8; padding: 8px 12px; border-radius: 10px; color: var(--primary); font-weight: 600; }

        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .gallery-card { background: #fff0f3; border-radius: 12px; overflow: hidden; border: 1px solid #ffd0d7; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .gallery-card img, .gallery-card video { width: 100%; height: 120px; object-fit: cover; display: block; border-radius: 12px 12px 0 0; background: #ffe3e8; }
        .gallery-card p { font-size: 11px; font-weight: 700; color: var(--primary); padding: 6px 4px; }

        /* Style bản đồ & liên hệ */
        .map-box { background: #fff0f3; border-radius: 15px; overflow: hidden; border: 1px solid #ffd0d7; height: 180px; margin-bottom: 10px; }
        .map-box iframe { width: 100%; height: 100%; border: 0; }
        .btn-map { display: block; background: #4285F4; color: white; text-align: center; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 14px; box-shadow: 0 4px 10px rgba(66,133,244,0.25); }
        
        .contact-box { background: #fff0f3; border: 1px dashed #ffd0d7; border-radius: 15px; padding: 12px 15px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <a href="index.html" class="nav-link active">🏠 Trang Chủ</a>
        <a href="bang-gia.html" id="linkBangGia" class="nav-link">🏷️ Bảng Giá</a>
        <a href="noi-quy.html" id="linkNoiQuy" class="nav-link">📜 Nội Quy</a>
    </div>

    <div class="header">
        <img src="logo.png" alt="Nana Homestay Logo" class="logo-img">
        <h1>Nana Homestay</h1>
        <p style="font-size: 12px; color: #8a626a; margin-top: 4px;">• <b>Instagram/Threads:</b> @nana.homestayy</p>
    </div>

    <!-- KHUNG CHỌN CƠ SỞ VÀ PHÒNG -->
    <div class="room-switch-box">
        <label for="roomSelect">📍 Chọn Cơ sở & Phòng:</label>
        <select id="roomSelect" onchange="changeRoomView()">
            <optgroup label="Cơ sở 1">
                <option value="cs1_p101" selected>Cơ sở 1 - P101</option>
            </optgroup>
            <optgroup label="Cơ sở 2">
                <option value="cs2_p205">Cơ sở 2 - Phòng 205</option>
                <option value="cs2_p305">Cơ sở 2 - Phòng 305</option>
            </optgroup>
        </select>
    </div>

    <!-- MỤC TIỆN NGHI TỰ ĐỘNG CẬP NHẬT THEO CƠ SỞ -->
    <div class="section">
        <div class="section-title">✨ Tiện nghi homestay</div>
        <div class="amenities" id="amenitiesContainer">
            <!-- Tải tiện nghi tự động bằng JavaScript -->
        </div>
    </div>

    <!-- HÌNH ẢNH PHÒNG TỰ ĐỘNG THAY ĐỔI THEO PHÒNG CHỌN -->
    <div class="section">
        <div class="section-title" id="galleryTitle">🖼️ Không gian Cơ sở 1 - P101</div>
        <div class="gallery" id="galleryContainer">
            <!-- Tải hình ảnh/video tự động bằng JavaScript -->
        </div>
    </div>

    <!-- BẢN ĐỒ CHỈ ĐƯỜNG TỰ ĐỘNG THAY ĐỔI THEO CƠ SỞ -->
    <div class="section">
        <div class="section-title" id="mapTitle">🗺️ Bản đồ chỉ đường (Cơ sở 1)</div>
        <div class="map-box">
            <iframe 
                id="mapIframe"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.123!2d105.789!3d21.071!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjHCsDA0JzE1LjYiTiAxMDXCsDQ3JzIwLjQiRQ!5e0!3m2!1svi!2svn!4v1680000000000!5m2!1svi!2svn" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
        <a href="https://maps.app.goo.gl/5KeYNUgYW6Rz8n3z7" id="mapBtn" target="_blank" class="btn-map">📍 Mở Chỉ Đường Trên Google Maps</a>

        <!-- Thông tin liên hệ -->
        <div class="contact-box">
            <div class="section-title" style="margin-bottom: 5px; border-left: none; padding-left: 0;">📞 Liên Hệ & Hỗ Trợ</div>
            <p style="font-size: 12.5px; line-height: 1.6; color: #5a3d42;">
                • <b>Hotline/Zalo:</b> 0836859883 / 0962292229<br>
                • <b>Instagram:</b> @nana.homestayy
            </p>
        </div>
    </div>
</div>

<script>

    const roomData = {

            mapTitle: "🗺️ Bản đồ chỉ đường (Cơ sở 2)",
            mapUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.123!2d105.789!3d21.071!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjHCsDA0JzE1LjYiTiAxMDXCsDQ3JzIwLjQiRQ!5e0!3m2!1svi!2svn!4v1680000000000!5m2!1svi!2svn",
            mapBtnLink: "https://maps.app.goo.gl/5KeYNUgYW6Rz8n3z7",

                <div class="amenity-item">🍳 Bếp nấu hiện đại</div>

                <div class="amenity-item">🅿️ Chỗ đỗ xe rộng rãi</div>

            galleryHtml: `
                <div class="gallery-card"><img src="home205_1.jpg" alt="Phòng 205"><p>🛏️ Không gian phòng 205</p></div>

                </div>
            `
        },
        cs2_p305: {
            title: "🖼️ Không gian Cơ sở 2 - Phòng 305",
            mapTitle: "🗺️ Bản đồ chỉ đường (Cơ sở 2)",
            mapUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.123!2d105.789!3d21.071!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjHCsDA0JzE1LjYiTiAxMDXCsDQ3JzIwLjQiRQ!5e0!3m2!1svi!2svn!4v1680000000000!5m2!1svi!2svn",

            amenitiesHtml: `
                <div class="amenity-item">📺 Tivi Netflix</div>

            `,
            galleryHtml: `
                <div class="gallery-card"><img src="home305_1.jpg" alt="Phòng 305"><p>🛏️ Không gian phòng 305</p></div>
                <div class="gallery-card"><img src="home305_2.jpg" alt="Góc chill 305"><p>✨ Góc trang trí chill</p></div>
                <div class="gallery-card"><img src="home305_3.jpg" alt="Tivi 305"><p>📺 Tivi Netflix</p></div>
                <div class="gallery-card">
                    <video controls preload="metadata">
                        <source src="video-wc305.mp4" type="video/mp4">
                    </video>
                    <p>📹 Video homestay</p>
                </div>
            `
        }
    };

    window.onload = function() {
        const savedRoom = localStorage.getItem('selectedRoom') || 'cs1_p101';
        const select = document.getElementById('roomSelect');
        if (select) {
            select.value = savedRoom;
        }
        changeRoomView();
    };

    function changeRoomView() {
        const selectedRoom = document.getElementById('roomSelect').value;
        localStorage.setItem('selectedRoom', selectedRoom);

        document.getElementById('linkBangGia').href = `bang-gia.html?room=${selectedRoom}`;
        document.getElementById('linkNoiQuy').href = `noi-quy.html?room=${selectedRoom}`;

        const data = roomData[selectedRoom];
        if (data) {
            document.getElementById('amenitiesContainer').innerHTML = data.amenitiesHtml;
            document.getElementById('galleryTitle').innerText = data.title;
            document.getElementById('galleryContainer').innerHTML = data.galleryHtml;
            document.getElementById('mapTitle').innerText = data.mapTitle;
            document.getElementById('mapIframe').src = data.mapUrl;
            document.getElementById('mapBtn').href = data.mapBtnLink;
        }
    }
</script>

</body>
</html>
