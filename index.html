<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Homestay - Lịch Dọn Phòng Của Cô</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #d17a85; --bg: #fff0f3; --card: #ffffff; --text: #5a3d42; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 10px; }
        .container { width: 100%; max-width: 480px; background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px rgba(209,122,133,0.15); padding: 15px; }

        .app-header { text-align: center; padding-bottom: 12px; border-bottom: 2px dashed #ffd0d7; margin-bottom: 15px; }
        .app-header h1 { color: var(--primary); font-size: 20px; font-weight: 700; }
        .app-header p { font-size: 13px; color: #8a626a; margin-top: 4px; }

        .today-banner { background: #ffe3e8; border: 2px solid var(--primary); border-radius: 15px; padding: 12px; text-align: center; margin-bottom: 15px; font-weight: 700; color: var(--primary); font-size: 14px; }

        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-card { background: #fafafa; border-radius: 15px; padding: 15px; border: 2px solid #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .task-card.done-card { background: #f6ffed; border-color: #b7eb8f; }

        .room-title { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        .task-details { font-size: 13px; line-height: 1.6; color: #444; margin-bottom: 10px; background: white; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
        .task-details b { color: #000; }

        .note-box { margin-bottom: 10px; }
        .note-box label { display: block; font-size: 11px; font-weight: 700; color: #8a626a; margin-bottom: 3px; }
        .note-input { width: 100%; padding: 8px; border: 1px solid #ffd0d7; border-radius: 8px; font-size: 12px; outline: none; background: #fffbe6; }

        .btn-clean-status { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; }
        .btn-not-done { background: #fffbe6; color: #d48806; border: 1.5px solid #ffe58f; }
        .btn-is-done { background: #f6ffed; color: #389e0d; border: 1.5px solid #b7eb8f; }

        .empty-msg { text-align: center; padding: 30px 10px; color: #888; font-size: 14px; font-weight: 600; }
    </style>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>🧹 Lịch Dọn Phòng Cơ Sở 2</h1>
        <p>Nana Homestay</p>
    </div>

    <div class="today-banner" id="todayText">
        📅 Lịch dọn ngày hôm nay
    </div>

    <!-- DANH SÁCH PHÒNG CẦN DỌN -->
    <div class="task-list" id="taskList">
        <div class="empty-msg">Đang tải lịch dọn...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDqGCFOectf_Dl7JjhlNyh5j6Sl2_tl1Sc",
      authDomain: "nana-homestay.firebaseapp.com",
      projectId: "nana-homestay",
      storageBucket: "nana-homestay.firebasestorage.app",
      messagingSenderId: "479892350682",
      appId: "1:479892350682:web:485d4dd69befd3dfc7a7e3",
      measurementId: "G-4ZE4FVEZHS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const cs2Rooms = [
        { id: "cs2_p205", name: "Cơ sở 2 - Phòng 205" },
        { id: "cs2_p305", name: "Cơ sở 2 - Phòng 305" }
    ];

    let allRoomsCache = {};

    window.onload = function() {
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        document.getElementById('todayText').innerText = `📅 Lịch dọn ngày: ${dd}/${mm}/${yyyy}`;

        listenToFirebase();
    };

    function listenToFirebase() {
        db.ref('rooms').on('value', (snapshot) => {
            allRoomsCache = snapshot.val() || {};
            renderCleanerTasks();
        });
    }

    function renderCleanerTasks() {
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = "";

        const today = new Date();
        const targetDayStr = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}`;
        const targetMonthKey = `${today.getFullYear()}_${today.getMonth() + 1}`;

        let hasTask = false;

        cs2Rooms.forEach(room => {
            let roomData = allRoomsCache[room.id] || {};
            let customers = roomData.customers || {};

            Object.keys(customers).forEach(custKey => {
                let cust = customers[custKey];
                if ((cust.monthKey || "2026_11") !== targetMonthKey) return;

                // Chỉ hiển thị nếu phần Dọn được chọn là "Cô"
                if (cust.cleaner === "Cô") {
                    hasTask = true;
                    let isDone = cust.cleanStatus === 'done';

                    let card = document.createElement('div');
                    card.className = `task-card ${isDone ? 'done-card' : ''}`;

                    card.innerHTML = `
                        <div class="room-title">
                            🏠 ${room.name}
                            <span>${isDone ? '✅ Đã dọn' : '🟡 Chưa dọn'}</span>
                        </div>
                        <div class="task-details">
                            👤 <b>Khách:</b> ${cust.name || 'Khách'}<br>
                            🚪 <b>Check-out (Khách ra):</b> ${cust.checkout || 'Chưa rõ'}<br>
                            🔑 <b>Check-in (Khách mới):</b> ${cust.checkin || 'Chưa rõ'}
                        </div>
                        <div class="note-box">
                            <label>📝 Ghi chú (Thêm giờ, ra muộn...):</label>
                            <input type="text" class="note-input" value="${cust.note || ''}" placeholder="Chưa có ghi chú..." readonly style="background: #fdfdfd; cursor: default;">
                        </div>
                        <button class="btn-clean-status ${isDone ? 'btn-is-done' : 'btn-not-done'}" 
                                onclick="toggleStatus('${room.id}', '${custKey}', '${cust.cleanStatus || 'pending'}')">
                            ${isDone ? '✅ ĐÃ DỌN XONG (Bấm để hủy)' : '🟡 BẤM VÀO ĐÂY KHI DỌN XONG'}
                        </button>
                    `;
                    taskList.appendChild(card);
                }
            });
        });

        if (!hasTask) {
            taskList.innerHTML = `<div class="empty-msg">🎉 Hôm nay (${targetDayStr}) cô chưa có phòng nào cần dọn ở Cơ sở 2 cả!</div>`;
        }
    }

    function toggleStatus(roomId, custKey, currentStatus) {
        const newStatus = (currentStatus === 'done') ? 'pending' : 'done';
        db.ref(`rooms/${roomId}/customers/${custKey}/cleanStatus`).set(newStatus);
    }
</script>

</body>
</html>
